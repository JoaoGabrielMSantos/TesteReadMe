<svg xmlns="http://www.w3.org/2000/svg" width="900" height="30" viewBox="0 0 900 30">
<defs><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#5B21B6" stop-opacity="0"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#5B21B6" stop-opacity="0"/></linearGradient>
